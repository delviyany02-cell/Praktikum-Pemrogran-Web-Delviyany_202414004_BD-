<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Elektronik Cepat</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        header{
            background:#171b20;
            color:white;
            text-align:center;
            padding:20px;
        }

        header h1{
            margin-bottom:10px;
        }

        #jam{
            font-size:18px;
            font-weight:bold;
        }

        .container{
            width:95%;
            margin:20px auto;
            display:grid;
            grid-template-columns:1fr 2fr;
            gap:20px;
        }

        .sidebar{
            background:white;
            border-radius:10px;
            padding:20px;
            box-shadow:0 0 10px rgba(0,0,0,.15);
        }

        .sidebar h2{
            margin-bottom:15px;
            color:#0d6efd;
        }

        .sidebar ul{
            list-style:none;
        }

        .sidebar li{
            padding:12px;
            margin-bottom:10px;
            border:1px solid #ddd;
            border-radius:5px;
            cursor:pointer;
            transition:.3s;
        }

        .sidebar li:hover{
            background:#0d6efd;
            color:white;
        }

        .content{
            background:white;
            border-radius:10px;
            padding:20px;
            box-shadow:0 0 10px rgba(0,0,0,.15);
        }

        .slideshow{
            text-align:center;
        }

        .slideshow img{
            width:100%;
            max-width:500px;
            height:300px;
            object-fit:cover;
            border-radius:10px;
            border:1px solid #ddd;
        }

        .btn{
            margin-top:15px;
            padding:10px 20px;
            border:none;
            background:#0d6efd;
            color:white;
            border-radius:5px;
            cursor:pointer;
        }

        .btn:hover{
            background:#084298;
        }

        #namaProduk{
            margin-top:20px;
            color:#0d6efd;
        }

        #hargaProduk{
            color:red;
            margin-top:10px;
            margin-bottom:20px;
            font-size:22px;
        }

        .form-order{
            margin-top:30px;
        }

        .form-order h2{
            color:#0d6efd;
            margin-bottom:15px;
        }

        .form-group{
            margin-bottom:15px;
        }

        .form-group label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        .form-group input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        #output{
            margin-top:20px;
            background:#eef7ff;
            border:1px solid #0d6efd;
            border-radius:8px;
            padding:15px;
            display:none;
            line-height:1.8;
        }

        @media(max-width:768px){

            .container{
                grid-template-columns:1fr;
            }

            .slideshow img{
                height:250px;
            }

        }
    </style>

</head>
<body>

<header>

    <h1>Toko Elektronik Cepat</h1>

    <div id="jam"></div>

</header>

<div class="container">

    <div class="sidebar">

        <h2>Daftar Produk</h2>

        <ul id="listProduk"></ul>

    </div>

    <div class="content">

        <div class="slideshow">

            <img id="gambarProduk" src="" alt="Produk">

            <br>

            <button class="btn" onclick="gantiGambar(-1)">
                Previous
            </button>

            <button class="btn" onclick="gantiGambar(1)">
                Next
            </button>

            <h2 id="namaProduk"></h2>

            <h3 id="hargaProduk"></h3>
                        <div class="form-order">

                <h2>Form Pemesanan</h2>

                <div class="form-group">
                    <label>Nama Pemesan</label>
                    <input type="text" id="namaPemesan" placeholder="Masukkan nama pemesan">
                </div>

                <div class="form-group">
                    <label>Jumlah Pesan</label>
                    <input type="number" id="jumlahPesan" placeholder="Masukkan jumlah">
                </div>

                <div class="form-group">
                    <label>Kode Promo</label>
                    <input type="text" id="kodePromo" placeholder="DISKON10">
                </div>

                <button class="btn" onclick="pesanProduk()">
                    Pesan Sekarang
                </button>

                <div id="output"></div>

            </div>

        </div>

    </div>

    <script>

        // ============================
        // DATA PRODUK
        // ============================

        var produk = [

            {
                nama: "Laptop ASUS Vivobook",
                harga: 8500000,
                gambar: [
                    "https://www.klikgalaxy.com/image-product/img92580-1766984463.jpg",
                    "https://id.store.asus.com/media/catalog/product/v/i/vivobook_go_14_e1404f_e1404g_product_photo_1s_cool_silver_05_fingerprint_backlit_4.jpg?width=716&height=716&store=id_ID&image-type=image",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTupJqqiWXS5ZbxdBepPY6XIOPEG-Mjzfcieg&s"
                ]
            },

            {
                nama: "Samsung Galaxy A56",
                harga: 5200000,
                gambar: [
                    "https://down-id.img.susercontent.com/file/id-11134207-7rbka-m7kiifdkdmmc03",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQL1aXciwK8KosqHm3hnL02jf_kN_albjbXew&s",
                    "https://preview.redd.it/what-do-you-think-of-the-specifications-of-the-samsung-v0-xmosfzron34e1.png?width=640&crop=smart&auto=webp&s=3e01f132d140515d4f7c344ea7453e88139c7008"
                ]
            },

            {
                nama: "Headset Bluetooth JBL",
                harga: 950000,
                gambar: [
                    "https://images.tokopedia.net/img/cache/700/VqbcmM/2022/11/7/ed3ff3cf-13d6-40d9-8834-41df85ee8b8c.jpg.webp",
                    "https://id.jbl.com/dw/image/v2/AAUJ_PRD/on/demandware.static/-/Sites-masterCatalog_Harman/default/dw6db21d2f/1.JBL_Wave_Vibe_Beam_Product%20Image_Hero_White.jpg?sw=270&sh=330&sm=fit&sfrm=png",
                    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSrG7gMuk1ILezRto7wWBZwTkvfd129QfDCqw&s"
                ]
            }

        ];

        var produkAktif = 0;
        var gambarAktif = 0;

        // ============================
        // JAM REAL TIME
        // ============================

        function updateJam(){

            var sekarang = new Date();

            document.getElementById("jam").innerHTML =
                sekarang.toLocaleDateString("id-ID") +
                " | " +
                sekarang.toLocaleTimeString("id-ID");

        }

        setInterval(updateJam,1000);
        updateJam();

        // MENAMPILKAN PRODUK
        function tampilkanProduk() {

            var p = produk[produkAktif];

            document.getElementById("gambarProduk").src = p.gambar[gambarAktif];
            document.getElementById("namaProduk").innerHTML = p.nama;
            document.getElementById("hargaProduk").innerHTML =
                "Harga : Rp " + p.harga.toLocaleString("id-ID");

        }
    
        //slideshow
        function gantiGambar(arah){

            gambarAktif += arah;

            if(gambarAktif >= produk[produkAktif].gambar.length){
                gambarAktif = 0;
            }

            if(gambarAktif < 0){
                gambarAktif = produk[produkAktif].gambar.length - 1;
            }

            tampilkanProduk();

        }

        function tampilkanDaftarProduk(){

            var daftar = document.getElementById("listProduk");

            daftar.innerHTML = "";

            for(let i = 0; i < produk.length; i++){

                daftar.innerHTML +=
                "<li onclick='pilihProduk(" + i + ")'>" +
                produk[i].nama +
                "</li>";

            }

        }

        // ============================
        // PILIH PRODUK
        // ============================

        function pilihProduk(index){

            produkAktif = index;

            gambarAktif = 0;

            tampilkanProduk();

        }

        tampilkanDaftarProduk();

        tampilkanProduk();
                // ============================
        // PEMESANAN
        // ============================

        function pesanProduk(){

            var nama = document.getElementById("namaPemesan").value.trim();
            var jumlah = parseInt(document.getElementById("jumlahPesan").value);
            var promo = document.getElementById("kodePromo").value.toUpperCase();

            // Validasi
            if(nama == ""){
                alert("Nama pemesan tidak boleh kosong!");
                return;
            }

            if(isNaN(jumlah) || jumlah <= 0){
                alert("Jumlah pesan harus lebih dari 0!");
                return;
            }

            // Data produk
            var harga = produk[produkAktif].harga;
            var namaProduk = produk[produkAktif].nama;

            // Hitung subtotal
            var subtotal = harga * jumlah;

            // Hitung diskon
            var potongan = 0;

            if(promo == "DISKON10"){
                potongan = subtotal * 0.10;
            }

            // Total akhir
            var total = subtotal - potongan;

            // Generate Order ID
            var orderID = "INV-" + Math.floor(10000 + Math.random() * 90000);

            // Tampilkan struk
            var output = document.getElementById("output");

            output.style.display = "block";

            output.innerHTML =
            "<h2>Struk Pemesanan</h2>" +

            "<hr>" +

            "<p><b>Order ID :</b> " + orderID + "</p>" +

            "<p><b>Nama Pemesan :</b> " + nama + "</p>" +

            "<p><b>Produk :</b> " + namaProduk + "</p>" +

            "<p><b>Harga :</b> Rp " +
            harga.toLocaleString("id-ID") +
            "</p>" +

            "<p><b>Jumlah :</b> " + jumlah + "</p>" +

            "<p><b>Subtotal :</b> Rp " +
            subtotal.toLocaleString("id-ID") +
            "</p>" +

            "<p><b>Potongan :</b> Rp " +
            potongan.toLocaleString("id-ID") +
            "</p>" +

            "<hr>" +

            "<h3>Total Bayar : Rp " +
            total.toLocaleString("id-ID") +
            "</h3>";

        }

    </script>

</body>
</html>
